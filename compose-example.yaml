# Example usage

services:
  caddy:
    image: ghcr.io/zackslash/caddy-plus:<version>
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?set in compose.override.yaml}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?set in compose.override.yaml}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    volumes:
      - ./volumes/config:/config
      - ./volumes/data:/data
      - ./volumes/etc/caddy:/etc/caddy
    ports:
      - 80:80
      - 443:443
    # Requires the default admin endpoint (localhost:2019) to be enabled;
    # drop this if you disable it in your Caddyfile global options.
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:2019/config/"]
